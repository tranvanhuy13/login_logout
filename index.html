<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #e5e7eb;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding: 16px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #0a0a0a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        overflow: hidden;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .tabs button {
        flex: 1;
        padding: 12px 4px;
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        color: #9ca3af;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      .tabs button:hover {
        color: #fff;
      }
      .tabs button.active {
        color: #fff;
        background: rgba(255, 255, 255, 0.05);
        border-bottom-color: #3b82f6;
      }
      .body {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #9ca3af;
        font-weight: 500;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 9px 12px;
        background: rgba(0, 0, 0, 0.3);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        font-size: 14px;
        outline: none;
      }
      input:focus {
        border-color: #3b82f6;
      }
      .pw {
        position: relative;
      }
      .pw input {
        padding-right: 64px;
      }
      .pw .toggle {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: 0;
        color: #60a5fa;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      .pw .toggle:hover {
        color: #93c5fd;
      }
      .hint {
        font-size: 11px;
        color: #6b7280;
        margin: 5px 0 0;
      }
      .btn {
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        background: #fff;
        color: #000;
        cursor: pointer;
      }
      .btn:hover {
        background: #e5e7eb;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.secondary {
        background: #1f2937;
        color: #fff;
      }
      .btn.secondary:hover {
        background: #374151;
      }
      .link {
        background: none;
        color: #60a5fa;
        font-weight: 500;
      }
      .link:hover {
        background: none;
        color: #93c5fd;
      }
      .link:disabled {
        color: #4b5563;
      }
      .msg {
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 13px;
        display: none;
      }
      .msg.show {
        display: block;
      }
      .msg.error {
        background: rgba(239, 68, 68, 0.12);
        color: #f87171;
      }
      .msg.ok {
        background: rgba(34, 197, 94, 0.12);
        color: #4ade80;
      }
      .otp {
        text-align: center;
        letter-spacing: 0.5em;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 20px;
      }
      .hidden {
        display: none !important;
      }
      .who {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .who h2 {
        margin: 0;
        font-size: 18px;
        color: #fff;
      }
      .who p {
        margin: 3px 0 0;
        font-size: 12px;
        color: #6b7280;
      }
      .badge {
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
        border: 1px solid;
      }
      .badge.verified {
        background: rgba(34, 197, 94, 0.15);
        color: #4ade80;
        border-color: rgba(34, 197, 94, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- ================= Chưa đăng nhập ================= -->
      <div id="guest">
        <div class="tabs">
          <button data-tab="login" class="active">Đăng nhập</button>
          <button data-tab="register">Tạo tài khoản</button>
          <button data-tab="verify">Nhập mã OTP</button>
        </div>

        <div class="body">
          <div id="error" class="msg error"></div>
          <div id="info" class="msg ok"></div>

          <!-- Đăng nhập -->
          <div id="tab-login" class="body" style="padding: 0">
            <div>
              <label>Tên đăng nhập</label
              ><input id="l-user" autocomplete="username" />
            </div>
            <div>
              <label>Mật khẩu</label>
              <div class="pw">
                <input
                  id="l-pass"
                  type="password"
                  autocomplete="current-password"
                />
                <button type="button" class="toggle" data-target="l-pass">
                  Hiện
                </button>
              </div>
            </div>
            <button class="btn" id="btn-login">Đăng nhập</button>
          </div>

          <!-- Đăng ký -->
          <div id="tab-register" class="body hidden" style="padding: 0">
            <div>
              <label>Tên đăng nhập</label
              ><input id="r-user" autocomplete="username" />
              <p class="hint">Chỉ gồm chữ và số, không có ký tự đặc biệt.</p>
            </div>
            <div>
              <label>Địa chỉ Gmail</label
              ><input
                id="r-email"
                type="email"
                placeholder="ten@gmail.com"
                autocomplete="email"
              />
            </div>
            <div>
              <label>Mật khẩu</label>
              <div class="pw">
                <input
                  id="r-pass"
                  type="password"
                  autocomplete="new-password"
                />
                <button type="button" class="toggle" data-target="r-pass">
                  Hiện
                </button>
              </div>
              <p class="hint">Chỉ gồm chữ và số, không có ký tự đặc biệt.</p>
            </div>
            <div>
              <label>Nhập lại mật khẩu</label>
              <div class="pw">
                <input
                  id="r-pass2"
                  type="password"
                  autocomplete="new-password"
                />
                <button type="button" class="toggle" data-target="r-pass2">
                  Hiện
                </button>
              </div>
            </div>
            <button class="btn" id="btn-register">Tạo tài khoản</button>
          </div>

          <!-- Xác minh OTP -->
          <div id="tab-verify" class="body hidden" style="padding: 0">
            <div>
              <label>Địa chỉ Gmail</label
              ><input id="v-email" type="email" placeholder="ten@gmail.com" />
            </div>
            <div>
              <label>Mã gồm 6 chữ số</label
              ><input
                id="v-otp"
                class="otp"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
              />
            </div>
            <button class="btn" id="btn-verify">Xác minh tài khoản</button>
            <button class="btn link" id="btn-resend">Gửi mã mới</button>
          </div>
        </div>
      </div>

      <!-- ================= Đã đăng nhập ================= -->
      <div id="member" class="body hidden">
        <div class="who">
          <div>
            <h2 id="m-name"></h2>
            <p id="m-email"></p>
          </div>
          <span id="m-badge" class="badge verified">Đã xác minh</span>
        </div>
        <div id="m-info" class="msg ok show">Đăng nhập thành công.</div>
        <button class="btn secondary" id="btn-logout">Đăng xuất</button>
      </div>
    </div>

    <script>
      // Khi trang được phục vụ bởi chính backend (python main.py) thì gọi cùng địa chỉ.
      // Nếu mở trực tiếp file thì trỏ tới localhost:8000.
      const API_URL = location.port === "8000" ? "" : "http://localhost:8000";

      const ALNUM = /^[A-Za-z0-9]+$/;
      const GMAIL = /^[A-Za-z0-9._%+-]+@gmail\.com$/i;
      const $ = (id) => document.getElementById(id);

      let cooldown = 0,
        cooldownTimer = null;

      // ---------- tiện ích ----------
      function show(el, text) {
        el.textContent = text;
        el.classList.add("show");
      }
      function hide(el) {
        el.textContent = "";
        el.classList.remove("show");
      }
      function clearMessages() {
        hide($("error"));
        hide($("info"));
      }
      function showError(t) {
        hide($("info"));
        show($("error"), t);
      }
      function showInfo(t) {
        hide($("error"));
        show($("info"), t);
      }

      // Không có token hay session: tên đăng nhập + mật khẩu được giữ trong bộ nhớ của trang
      // và gửi kèm mỗi yêu cầu cần đăng nhập (Authorization: Basic ...). Tải lại trang (F5) sẽ mất đăng nhập.
      let creds = null; // { username, password }

      async function api(path, method, body, withCreds) {
        const headers = { "Content-Type": "application/json" };
        if (withCreds) {
          headers["Authorization"] =
            "Basic " +
            btoa(
              unescape(
                encodeURIComponent(
                  withCreds.username + ":" + withCreds.password,
                ),
              ),
            );
        }
        const res = await fetch(API_URL + path, {
          method,
          headers,
          body: body ? JSON.stringify(body) : undefined,
        });
        let data = {};
        try {
          data = await res.json();
        } catch (e) {}
        return { ok: res.ok, status: res.status, data };
      }

      // Đổi thông báo của server sang tiếng Việt
      const serverMessages = {
        "Username and password must not contain special characters":
          "Tên đăng nhập và mật khẩu không được chứa ký tự đặc biệt!",
        "Please use a valid Gmail address (example@gmail.com).":
          "Hãy dùng địa chỉ Gmail (ten@gmail.com).",
        "Username already registered": "Tên đăng nhập đã tồn tại!",
        "Email already registered": "Email đã được đăng ký!",
        "Account not found": "Không tìm thấy tài khoản!",
        "Account already verified": "Tài khoản đã được xác thực!",
        "Invalid OTP": "Mã OTP không đúng!",
        "OTP has expired": "Mã OTP đã hết hạn! Hãy bấm 'Gửi mã mới'.",
        "Could not send OTP email":
          "Không gửi được email OTP. Vui lòng thử lại sau.",
        "Account not verified":
          "Tài khoản chưa xác thực OTP. Hãy nhập mã gửi tới Gmail của bạn.",
        "Incorrect username or password": "Sai Tên đăng nhập hoặc Mật khẩu!",
      };

      function errText(r) {
        const d = r.data && r.data.detail;
        if (typeof d === "string") {
          if (serverMessages[d]) return serverMessages[d];
          const m = d.match(/^Please wait (\d+)s/);
          if (m)
            return "Vui lòng đợi " + m[1] + " giây trước khi yêu cầu mã mới.";
          return d;
        }
        if (Array.isArray(d)) return "Vui lòng kiểm tra lại các ô nhập.";
        return "Yêu cầu thất bại (" + r.status + ")";
      }

      async function guarded(btn, fn) {
        btn.disabled = true;
        try {
          await fn();
        } catch (e) {
          showError("Không kết nối được tới máy chủ.");
        } finally {
          btn.disabled = btn.id === "btn-resend" && cooldown > 0;
        }
      }

      // ---------- ẩn / hiện mật khẩu ----------
      document.querySelectorAll(".toggle").forEach((b) =>
        b.addEventListener("click", () => {
          const input = $(b.dataset.target);
          const hidden = input.type === "password";
          input.type = hidden ? "text" : "password";
          b.textContent = hidden ? "Ẩn" : "Hiện";
        }),
      );

      // ---------- chuyển tab ----------
      function switchTab(name) {
        document
          .querySelectorAll(".tabs button")
          .forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
        ["login", "register", "verify"].forEach((t) =>
          $("tab-" + t).classList.toggle("hidden", t !== name),
        );
        clearMessages();
      }
      document
        .querySelectorAll(".tabs button")
        .forEach((b) =>
          b.addEventListener("click", () => switchTab(b.dataset.tab)),
        );

      function switchTabKeepMsg(name) {
        const msg = $("error").textContent;
        switchTab(name);
        showError(msg);
      }

      // ---------- đếm ngược gửi lại mã ----------
      function startCooldown(sec) {
        cooldown = sec;
        clearInterval(cooldownTimer);
        renderCooldown();
        cooldownTimer = setInterval(() => {
          cooldown--;
          renderCooldown();
          if (cooldown <= 0) clearInterval(cooldownTimer);
        }, 1000);
      }
      function renderCooldown() {
        const b = $("btn-resend");
        b.disabled = cooldown > 0;
        b.textContent =
          cooldown > 0 ? "Gửi mã mới sau " + cooldown + " giây" : "Gửi mã mới";
      }

      // ---------- giao diện đã / chưa đăng nhập ----------
      function renderMember(user) {
        $("guest").classList.add("hidden");
        $("member").classList.remove("hidden");
        $("m-name").textContent = user.username;
        $("m-email").textContent = user.email;
      }
      function renderGuest() {
        $("member").classList.add("hidden");
        $("guest").classList.remove("hidden");
      }

      // ---------- hành động ----------
      $("btn-login").addEventListener("click", () =>
        guarded($("btn-login"), async () => {
          clearMessages();
          const username = $("l-user").value.trim(),
            password = $("l-pass").value;
          if (!username && !password)
            return showError("Vui lòng nhập thông tin.");
          if (!username) return showError("Vui lòng nhập Tên đăng nhập!");
          if (!password) return showError("Vui lòng nhập Mật khẩu!");

          const r = await api("/users/me", "GET", null, { username, password });
          if (r.ok) {
            creds = { username, password };
            $("l-pass").value = "";
            renderMember(r.data);
          } else {
            showError(errText(r));
            if (r.status === 403) switchTabKeepMsg("verify");
          }
        }),
      );

      $("btn-register").addEventListener("click", () =>
        guarded($("btn-register"), async () => {
          clearMessages();
          const username = $("r-user").value.trim(),
            email = $("r-email").value.trim();
          const password = $("r-pass").value,
            password2 = $("r-pass2").value;

          if (!username && !email && !password && !password2)
            return showError("Vui lòng nhập thông tin.");
          if (!username) return showError("Vui lòng nhập Tên đăng nhập!");
          if (!email) return showError("Vui lòng nhập Email!");
          if (!password) return showError("Vui lòng nhập Mật khẩu!");
          if (!password2) return showError("Vui lòng nhập lại Mật khẩu!");
          if (!ALNUM.test(username))
            return showError("Tên đăng nhập không được chứa ký tự đặc biệt!");
          if (!GMAIL.test(email))
            return showError("Hãy dùng địa chỉ Gmail (ten@gmail.com).");
          if (!ALNUM.test(password))
            return showError("Mật khẩu không được chứa ký tự đặc biệt!");
          if (password !== password2)
            return showError("Mật khẩu xác nhận không khớp!");

          const r = await api("/auth/signup", "POST", {
            username,
            email,
            password,
          });
          if (r.ok) {
            $("r-pass").value = "";
            $("r-pass2").value = "";
            $("v-email").value = email;
            switchTab("verify");
            startCooldown(60);
            showInfo(
              "Đã gửi mã 6 chữ số tới Gmail của bạn. Nhập mã bên dưới để kích hoạt tài khoản.",
            );
          } else showError(errText(r));
        }),
      );

      $("btn-verify").addEventListener("click", () =>
        guarded($("btn-verify"), async () => {
          clearMessages();
          const email = $("v-email").value.trim(),
            otp = $("v-otp").value;
          if (!email && !otp) return showError("Vui lòng nhập thông tin.");
          if (!email) return showError("Vui lòng nhập Email!");
          if (!otp) return showError("Vui lòng nhập mã OTP!");
          if (!GMAIL.test(email))
            return showError("Nhập đúng Gmail bạn đã đăng ký.");
          if (!/^[0-9]{6}$/.test(otp))
            return showError("Mã gồm đúng 6 chữ số.");

          const r = await api("/auth/verify-otp", "POST", { email, otp });
          if (r.ok) {
            $("v-otp").value = "";
            switchTab("login");
            showInfo("Tài khoản đã được xác minh. Bạn có thể đăng nhập.");
          } else showError(errText(r));
        }),
      );

      $("btn-resend").addEventListener("click", () =>
        guarded($("btn-resend"), async () => {
          clearMessages();
          const email = $("v-email").value.trim();
          if (!email) return showError("Vui lòng nhập Email!");
          if (!GMAIL.test(email)) return showError("Nhập Gmail của bạn trước.");

          const r = await api("/auth/resend-otp", "POST", { email });
          if (r.ok) {
            startCooldown(60);
            showInfo("Mã mới đã được gửi tới Gmail của bạn.");
          } else showError(errText(r));
        }),
      );

      $("btn-logout").addEventListener("click", () => {
        creds = null;
        renderGuest();
        switchTab("login");
        showInfo("Bạn đã đăng xuất.");
      });

      // Nhấn Enter để gửi
      [
        ["l-user", "btn-login"],
        ["l-pass", "btn-login"],
        ["r-pass2", "btn-register"],
        ["v-otp", "btn-verify"],
      ].forEach(([input, btn]) =>
        $(input).addEventListener("keydown", (e) => {
          if (e.key === "Enter") $(btn).click();
        }),
      );
      $("v-otp").addEventListener("input", (e) => {
        e.target.value = e.target.value.replace(/\D/g, "");
      });

      renderCooldown();
      $("btn-resend").disabled = false;
      renderGuest();
    </script>
  </body>
</html>
